name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only PR runs get superseded by newer pushes; every run on main finishes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm test:coverage

  # Benchmarks the PR and its base branch on the SAME runner, back to back:
  # numbers from different machines aren't comparable (ADR 0020).
  bench:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare the base branch
        if: github.event_name == 'pull_request'
        id: base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ ! -d ../base/packages/eval-core/bench ]; then
            echo "::notice::No benchmarks on ${{ github.base_ref }} yet; reporting without a comparison."
            exit 0
          fi
          (cd ../base && pnpm install --frozen-lockfile)
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Base and head take turns, 3 runs each, so a slow patch on the shared
      # runner hits both sides; each side's median run is then compared.
      - name: Benchmark base and head, alternating
        run: |
          R=packages/eval-core/.bench-results
          for n in 1 2 3; do
            if [ "${{ steps.base.outputs.ready }}" = "true" ]; then
              (cd ../base && BENCH_OUT=.bench-results/base-$n pnpm bench)
            fi
            BENCH_OUT=.bench-results/head-$n pnpm bench
          done
          node tools/bench-check/median.mjs $R/head $R/head-1 $R/head-2 $R/head-3
          if [ "${{ steps.base.outputs.ready }}" = "true" ]; then
            B=../base/$R
            node tools/bench-check/median.mjs $R/base $B/base-1 $B/base-2 $B/base-3
          fi

      - name: Compare (fails on regression)
        run: |
          node tools/bench-check/check.mjs packages/eval-core/.bench-results/base packages/eval-core/.bench-results/head --threshold 0.20
