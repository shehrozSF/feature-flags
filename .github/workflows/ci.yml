name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand from the Actions tab (on main): redeploys main. With
  # force_smoke_failure, the smoke test fails on purpose to rehearse the rollback.
  workflow_dispatch:
    inputs:
      force_smoke_failure:
        description: Fail the smoke test on purpose, to check that both Workers roll back
        type: boolean
        default: false

# Only PR runs get superseded by newer pushes; every run on main finishes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm test:coverage
      - run: pnpm --filter @ff/dashboard --filter @ff/demo-site build

  # Benchmarks the PR and its base branch on the SAME runner, back to back:
  # numbers from different machines aren't comparable (ADR 0020).
  bench:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare the base branch
        if: github.event_name == 'pull_request'
        id: base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ ! -d ../base/packages/eval-core/bench ]; then
            echo "::notice::No benchmarks on ${{ github.base_ref }} yet; reporting without a comparison."
            exit 0
          fi
          (cd ../base && pnpm install --frozen-lockfile)
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Base and head take turns, 3 runs each, so a slow patch on the shared
      # runner hits both sides; each side's median run is then compared.
      - name: Benchmark base and head, alternating
        run: |
          R=packages/eval-core/.bench-results
          for n in 1 2 3; do
            if [ "${{ steps.base.outputs.ready }}" = "true" ]; then
              (cd ../base && BENCH_OUT=.bench-results/base-$n pnpm bench)
            fi
            BENCH_OUT=.bench-results/head-$n pnpm bench
          done
          node tools/bench-check/median.mjs $R/head $R/head-1 $R/head-2 $R/head-3
          if [ "${{ steps.base.outputs.ready }}" = "true" ]; then
            B=../base/$R
            node tools/bench-check/median.mjs $R/base $B/base-1 $B/base-2 $B/base-3
          fi

      - name: Compare (fails on regression)
        run: |
          node tools/bench-check/check.mjs packages/eval-core/.bench-results/base packages/eval-core/.bench-results/head --threshold 0.20

  # Every push to main that passes check and bench goes live: migrate Neon → deploy
  # the API Worker → deploy the demo's pricing backend → smoke-test both live URLs.
  # If anything after a deploy fails, both Workers roll back to the versions that
  # were live before (ADR 0035). The dashboard and demo site follow in the pages job.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, bench]
    runs-on: ubuntu-latest
    # Deploys queue instead of overlapping, and a running one is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Direct (unpooled) Neon URL: migrate holds a session-level advisory lock,
      # which a transaction-pooled connection can't keep.
      - name: Migrate the database
        run: pnpm --filter @ff/api migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # What's live now, so a failed deploy can go back to it. Empty for a Worker
      # that was never deployed (then there's nothing to roll back to).
      - name: Record the live versions
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          live() {
            (cd "$1" && pnpm exec wrangler deployments status --json 2>/dev/null) |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s.slice(s.indexOf("{"))).versions.sort((a,b)=>b.percentage-a.percentage)[0];console.log(v?v.version_id:"")}catch{console.log("")}})'
          }
          echo "api=$(live apps/api)" >> "$GITHUB_OUTPUT"
          echo "backend=$(live apps/demo-backend)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Deploy the Worker
        id: deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --var "GIT_SHA:${{ github.sha }}" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy the pricing backend
        id: backend
        working-directory: apps/demo-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # --dashboard-origin must match DASHBOARD_ORIGIN in apps/api/wrangler.jsonc.
      - name: Smoke test the live API and pricing backend
        run: >-
          pnpm smoke "${{ steps.deploy.outputs.url }}"
          --dashboard-origin https://shehrozsf.github.io
          --backend "${{ steps.backend.outputs.url }}"
          ${{ inputs.force_smoke_failure && '--fail' || '' }}

      # A deploy takes a few seconds to reach every Cloudflare location, so a single
      # /health answer can still come from the previous version (issues #84).
      # Ask up to 10 times, 3 s apart, before calling the deploy failed.
      - name: Live version is this commit
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.url }}/health
          EXPECTED: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 10); do
            version=$(curl -fsS "$HEALTH_URL" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || true)
            echo "attempt $attempt: live version ${version:-unknown}"
            if [ "$version" = "$EXPECTED" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::/health never reported $EXPECTED within 30 s"
          exit 1

      # Database migrations stay expand-only, so the previous code still works
      # against the new schema (ADR 0035). Pages isn't deployed yet: nothing to undo.
      - name: Roll back to the previous versions
        if: failure() && (steps.deploy.outcome == 'success' || steps.backend.outcome == 'success')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: smoke test failed for ${{ github.sha }}
        run: |
          rollback() { # <dir> <deployed?> <version id>
            if [ "$2" != success ]; then echo "$1: not deployed, nothing to undo"; return; fi
            if [ -z "$3" ]; then echo "::warning::$1: no previous version recorded"; return; fi
            (cd "$1" && pnpm exec wrangler rollback "$3" --message "$MESSAGE" --yes)
            (cd "$1" && pnpm exec wrangler deployments status)
          }
          rollback apps/api "${{ steps.deploy.outcome }}" "${{ steps.before.outputs.api }}"
          rollback apps/demo-backend "${{ steps.backend.outcome }}" "${{ steps.before.outputs.backend }}"
          echo "::error::rolled back after a failed deploy check; this run stays failed"

  # One GitHub Pages site, two apps (ADR 0032): /feature-flags/dashboard/ and
  # /feature-flags/demo/. Builds use the live URLs (each app's config.ts), so this
  # runs only after the API and pricing backend are live and smoke-tested.
  pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}dashboard/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ff/dashboard --filter @ff/demo-site build

      - name: Put both apps in one site
        run: |
          mkdir -p site
          cp -r apps/dashboard/dist site/dashboard
          cp -r apps/demo-site/dist site/demo
          # The site root has no app of its own: send visitors to the dashboard.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=dashboard/" />
          <title>Feature flags</title>
          <a href="dashboard/">Open the dashboard</a>
          HTML

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
