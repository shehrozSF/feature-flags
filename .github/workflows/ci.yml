name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Run the benchmark A/A calibration (10 runs of identical code)'
        type: boolean
        default: true

# Separate groups per event, so a manual calibration run and a push to main
# never cancel each other. Only PR runs get superseded by newer pushes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage

  # Benchmarks the PR and its base branch on the SAME runner, back to back:
  # numbers from different machines aren't comparable (ADR 0020).
  bench:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare the base branch
        if: github.event_name == 'pull_request'
        id: base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ ! -d ../base/packages/eval-core/bench ]; then
            echo "::notice::No benchmarks on ${{ github.base_ref }} yet; reporting without a comparison."
            exit 0
          fi
          (cd ../base && pnpm install --frozen-lockfile)
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Base and head take turns, 3 runs each, so a slow patch on the shared
      # runner hits both sides; each side's median run is then compared.
      - name: Benchmark base and head, alternating
        run: |
          R=packages/eval-core/.bench-results
          for n in 1 2 3; do
            if [ "${{ steps.base.outputs.ready }}" = "true" ]; then
              (cd ../base && BENCH_OUT=.bench-results/base-$n pnpm bench)
            fi
            BENCH_OUT=.bench-results/head-$n pnpm bench
          done
          node tools/bench-check/median.mjs $R/head $R/head-1 $R/head-2 $R/head-3
          if [ "${{ steps.base.outputs.ready }}" = "true" ]; then
            B=../base/$R
            node tools/bench-check/median.mjs $R/base $B/base-1 $B/base-2 $B/base-3
          fi

      - name: Compare (fails on regression)
        run: |
          node tools/bench-check/check.mjs packages/eval-core/.bench-results/base packages/eval-core/.bench-results/head --threshold 0.30

  # A/A calibration: 9 runs of identical code, grouped into 3 medians of 3 (the
  # same way PRs are compared), then the largest change between medians.
  bench-calibrate:
    if: github.event_name == 'workflow_dispatch' && inputs.calibrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks 9 times
        run: for n in $(seq 1 9); do BENCH_OUT=.bench-results/run-$n pnpm bench; done
      - name: Report A/A noise of medians and suggested threshold
        run: |
          R=packages/eval-core/.bench-results
          for g in 0 1 2; do
            node tools/bench-check/median.mjs $R/median-$g $R/run-$((g*3+1)) $R/run-$((g*3+2)) $R/run-$((g*3+3))
          done
          node tools/bench-check/noise.mjs $R/median-0 $R/median-1 $R/median-2
