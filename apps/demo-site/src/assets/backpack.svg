<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f6a45"/>
      <stop offset="0.35" stop-color="#76825a"/>
      <stop offset="0.7" stop-color="#6a764f"/>
      <stop offset="1" stop-color="#4c5536"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7650"/>
      <stop offset="0.5" stop-color="#5d6844"/>
      <stop offset="1" stop-color="#454d32"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#434b30"/>
      <stop offset="1" stop-color="#58623f"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#727e56"/>
      <stop offset="1" stop-color="#5a6443"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a2c"/>
      <stop offset="0.45" stop-color="#9c6440"/>
      <stop offset="1" stop-color="#6e4126"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d79a"/>
      <stop offset="0.5" stop-color="#c9a25a"/>
      <stop offset="1" stop-color="#8e6c2e"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="none"/>
      <path d="M0 0 H6" stroke="#000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="400" cy="822" rx="250" ry="26" fill="#2a2016" opacity="0.28" filter="url(#soft)"/>

  <!-- Shoulder straps, peeking out behind -->
  <path d="M262 214 C 205 260, 190 420, 196 560" fill="none" stroke="#3b4229" stroke-width="30" stroke-linecap="round"/>
  <path d="M538 214 C 595 260, 610 420, 604 560" fill="none" stroke="#353c25" stroke-width="30" stroke-linecap="round"/>

  <!-- Side pockets -->
  <path d="M222 470 Q 176 482 174 566 L 178 724 Q 182 780 226 784 Z" fill="url(#side)"/>
  <path d="M578 470 Q 624 482 626 566 L 622 724 Q 618 780 574 784 Z" fill="#3f472e"/>
  <path d="M186 520 Q 200 512 220 514" fill="none" stroke="#2f3522" stroke-width="3" opacity="0.6"/>
  <path d="M614 520 Q 600 512 580 514" fill="none" stroke="#2f3522" stroke-width="3" opacity="0.6"/>

  <!-- Top handle -->
  <path d="M352 188 Q 350 116 400 114 Q 450 116 448 188" fill="none" stroke="url(#leather)" stroke-width="20" stroke-linecap="round"/>
  <path d="M352 188 Q 350 116 400 114 Q 450 116 448 188" fill="none" stroke="#f3dcc0" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.45"/>

  <!-- Body -->
  <path d="M232 262 Q 232 178 322 174 L 478 174 Q 568 178 568 262 L 584 740 Q 588 808 520 810 L 280 810 Q 212 808 216 740 Z" fill="url(#body)"/>
  <path d="M232 262 Q 232 178 322 174 L 478 174 Q 568 178 568 262 L 584 740 Q 588 808 520 810 L 280 810 Q 212 808 216 740 Z" fill="url(#weave)"/>
  <path d="M232 262 Q 232 178 322 174 L 478 174 Q 568 178 568 262 L 584 740 Q 588 808 520 810 L 280 810 Q 212 808 216 740 Z" fill="url(#bodyShade)"/>
  <path d="M232 262 Q 232 178 322 174 L 478 174 Q 568 178 568 262 L 584 740 Q 588 808 520 810 L 280 810 Q 212 808 216 740 Z" fill="url(#sheen)"/>
  <!-- Body seam -->
  <path d="M244 268 Q 244 192 324 188 L 476 188 Q 556 192 556 268 L 571 738 Q 574 794 518 796 L 282 796 Q 226 794 229 738 Z" fill="none" stroke="#2f3522" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- Base panel -->
  <path d="M218 742 Q 214 806 280 810 L 520 810 Q 586 806 582 742 Q 500 760 400 760 Q 300 760 218 742 Z" fill="#3a3326" opacity="0.92"/>
  <path d="M218 742 Q 300 760 400 760 Q 500 760 582 742" fill="none" stroke="#1f1b14" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Front pocket -->
  <rect x="268" y="574" width="264" height="168" rx="42" fill="url(#pocket)"/>
  <rect x="268" y="574" width="264" height="168" rx="42" fill="url(#weave)"/>
  <rect x="278" y="584" width="244" height="148" rx="34" fill="none" stroke="#2f3522" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Zip -->
  <path d="M292 612 Q 400 594 508 612" fill="none" stroke="#2c3120" stroke-width="5" stroke-linecap="round"/>
  <path d="M292 612 Q 400 594 508 612" fill="none" stroke="#9aa27f" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <rect x="494" y="604" width="12" height="16" rx="3" fill="url(#brass)"/>
  <path d="M500 620 L 500 652" stroke="url(#leather)" stroke-width="9" stroke-linecap="round"/>

  <!-- Leather patch -->
  <rect x="352" y="652" width="96" height="34" rx="6" fill="url(#leather)"/>
  <rect x="357" y="657" width="86" height="24" rx="4" fill="none" stroke="#f3dcc0" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="400" y="674" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.5" fill="#f6e3c8" fill-opacity="0.9">LARKSPUR</text>

  <!-- Flap -->
  <path d="M230 254 Q 232 186 322 182 L 478 182 Q 568 186 570 254 L 574 418 Q 574 476 518 480 L 282 480 Q 226 476 226 418 Z" fill="url(#flap)"/>
  <path d="M230 254 Q 232 186 322 182 L 478 182 Q 568 186 570 254 L 574 418 Q 574 476 518 480 L 282 480 Q 226 476 226 418 Z" fill="url(#weave)"/>
  <path d="M242 258 Q 244 198 324 195 L 476 195 Q 556 198 558 258 L 561 416 Q 561 464 516 467 L 284 467 Q 239 464 239 416 Z" fill="none" stroke="#252a1a" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M226 418 Q 226 476 282 480 L 518 480 Q 574 476 574 418" fill="none" stroke="#1f2416" stroke-opacity="0.35" stroke-width="6"/>
  <ellipse cx="330" cy="250" rx="110" ry="46" fill="#fff" opacity="0.06"/>

  <!-- Straps over the flap -->
  <g>
    <rect x="316" y="330" width="30" height="270" rx="6" fill="url(#leather)"/>
    <rect x="454" y="330" width="30" height="270" rx="6" fill="url(#leather)"/>
    <path d="M321 338 V 592 M341 338 V 592 M459 338 V 592 M479 338 V 592" stroke="#f3dcc0" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 5"/>
    <!-- Strap ends -->
    <path d="M316 330 Q 331 316 346 330" fill="#6e4126"/>
    <path d="M454 330 Q 469 316 484 330" fill="#6e4126"/>
  </g>

  <!-- Buckles -->
  <g>
    <rect x="306" y="452" width="50" height="40" rx="8" fill="none" stroke="url(#brass)" stroke-width="7"/>
    <path d="M331 456 V 488" stroke="url(#brass)" stroke-width="4" stroke-linecap="round"/>
    <rect x="444" y="452" width="50" height="40" rx="8" fill="none" stroke="url(#brass)" stroke-width="7"/>
    <path d="M469 456 V 488" stroke="url(#brass)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="331" cy="540" r="3.5" fill="#2a1a10" opacity="0.7"/>
    <circle cx="331" cy="562" r="3.5" fill="#2a1a10" opacity="0.7"/>
    <circle cx="469" cy="540" r="3.5" fill="#2a1a10" opacity="0.7"/>
    <circle cx="469" cy="562" r="3.5" fill="#2a1a10" opacity="0.7"/>
  </g>

  <!-- Edge light -->
  <path d="M236 290 Q 236 210 300 192" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
</svg>
